services:
  - type: web
    name: shopify-scraper-pro
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_PATH
        value: /opt/render/project/src/shopify_scraper.db
      - key: IMAGES_PATH
        value: /opt/render/project/src/images
    disk:
      name: data
      mountPath: /opt/render/project/src
      sizeGB: 1
